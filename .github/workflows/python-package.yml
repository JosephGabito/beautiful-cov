name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable . --group dev

      - name: Run tests
        run: python -m pytest

  quality:
    name: Quality and distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development and release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable . --group dev --group release

      - name: Check formatting
        run: |
          python -m black --check src tests
          python -m ruff format --check src tests

      - name: Lint
        run: python -m ruff check src tests

      - name: Type check
        run: python -m mypy src

      - name: Generate a report for beautiful-cov
        run: |
          python -m pytest --cov=beautiful_cov --cov-context=test
          beautiful-cov --output beautiful-cov-report
          test -s beautiful-cov-report/index.html

      - name: Build distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*
