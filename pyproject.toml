[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "beautiful-cov"
version = "0.1.0b2"
description = "Beautiful local reports for Coverage.py"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Joseph Gabito" }]
requires-python = ">=3.10"
dependencies = [
    "coverage>=7.0",
    "jinja2>=3.1",
    "pygments>=2.17",
]
keywords = ["coverage", "reporting", "testing", "html"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/JosephGabito/beautiful-cov"
Repository = "https://github.com/JosephGabito/beautiful-cov"
Issues = "https://github.com/JosephGabito/beautiful-cov/issues"

[project.scripts]
beautiful-cov = "beautiful_cov.cli:main"

[dependency-groups]
dev = [
    "black==26.5.1",
    "mypy==2.3.0",
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
    "ruff==0.16.0",
    "types-Pygments==2.20.0.20260518",
]
release = [
    "build==1.5.0",
    "twine==6.2.0",
]

[tool.black]
target-version = ["py310"]

[tool.hatch.build.targets.wheel]
packages = ["src/beautiful_cov"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.ruff]
target-version = "py310"
