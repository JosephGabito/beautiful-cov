<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }}</title>
  <link rel="stylesheet" href="{{ stylesheet_href }}">
  <script src="{{ script_href }}" defer></script>
</head>
<body>
  <div class="page{% block page_class %}{% endblock %}">
    <header class="site-header">
      <a class="brand" href="{{ home_href }}" aria-label="beautiful-cov dashboard">
        <span>beautiful-cov</span>
        <span class="brand-rule" aria-hidden="true"></span>
      </a>
      <div class="generated">Generated locally · Coverage.py</div>
    </header>

    <main>
      {% block main required %}{% endblock %}
    </main>

    <footer class="site-footer">
      <span>beautiful-cov</span>
      <span>Coverage.py data</span>
    </footer>
  </div>
</body>
</html>
